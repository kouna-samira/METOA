spring.application.name=METOA
# Configuration base de données (une seule !)
spring.datasource.url=jdbc:mysql://localhost:3306/METOA
spring.datasource.username=samira
spring.datasource.password=samira123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

server.port=8089

# Activer le multipart
spring.servlet.multipart.enabled=true

# Taille maximale des fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.resources.static-locations=file:uploads/
